name: Datadog Terraform Backend

# CDK app (TypeScript) for the shared Datadog Terraform backend in the autoguru-shared account:
# state bucket, lock table, KMS key, and the per-repo GitHub OIDC roles and secret shells that
# consumer repos (mfe, ignite) use to run Terraform against Datadog. Scoped to the
# datadog-terraform/ subtree so unrelated devsecops changes never touch this infrastructure.
#
# - Pull requests that touch datadog-terraform/** run `cdk diff` (read-only, no changes).
# - Deploys are MANUAL (workflow_dispatch) so infra is never applied implicitly by a merge to
#   main; an operator triggers the deploy and reviews the diff in the run log.
#
# Uses the same AWS_DEPLOY_ROLE_ARN repository secret as netbird-deploy.yml.

on:
  pull_request:
    paths:
      - 'datadog-terraform/infra/**'
      - '.github/workflows/datadog-terraform-infra.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'CDK action to run'
        required: true
        default: 'diff'
        type: choice
        options:
          - diff
          - deploy

permissions:
  id-token: write   # OIDC auth to AWS -- no stored access keys
  contents: read

concurrency:
  group: datadog-terraform-infra
  cancel-in-progress: false

defaults:
  run:
    working-directory: datadog-terraform/infra

jobs:
  cdk:
    name: CDK ${{ github.event_name == 'pull_request' && 'diff' || inputs.action }}
    runs-on: ubuntu-latest
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: datadog-terraform/infra/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (compile check)
        run: npx tsc --noEmit

      - name: Note missing deploy role
        if: env.AWS_DEPLOY_ROLE_ARN == ''
        run: echo "::warning::AWS_DEPLOY_ROLE_ARN secret is not configured; skipping cdk diff/deploy."

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.AWS_DEPLOY_ROLE_ARN != ''
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: CDK Diff
        if: env.AWS_DEPLOY_ROLE_ARN != '' && (github.event_name == 'pull_request' || inputs.action == 'diff')
        run: npx cdk diff DatadogTerraformInfraStack

      - name: CDK Deploy (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy' && env.AWS_DEPLOY_ROLE_ARN != ''
        run: npx cdk deploy DatadogTerraformInfraStack --require-approval never
